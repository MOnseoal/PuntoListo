{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block encabezado %}{% endblock %}

{% block contenido %}
<div class="acceso-hero">
  <img src="{{ url_for('recursos.archivo', archivo='icono-192.png') }}" alt="" width="64" height="64">
  <h1>Entrar</h1>
  <p>Registra órdenes y avisa a tus clientes por WhatsApp.</p>
</div>

<article>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" value="{{ correo }}"
           autocomplete="email" inputmode="email" required>

    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena"
           autocomplete="current-password" required>

    <button type="submit">Entrar</button>
  </form>

  <footer>
    ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Crea una gratis</a>
  </footer>
</article>
{% endblock %}
