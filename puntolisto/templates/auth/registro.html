{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<article>
  <header>
    <h1>Crear cuenta</h1>
    <p>Gratis. Después configuras tu negocio.</p>
  </header>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" value="{{ correo }}"
           autocomplete="email" inputmode="email" required>

    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" minlength="8"
           autocomplete="new-password" required>
    <p class="ayuda">Mínimo 8 caracteres.</p>

    <label for="confirmar">Repite la contraseña</label>
    <input type="password" id="confirmar" name="confirmar" minlength="8"
           autocomplete="new-password" required>

    <button type="submit">Crear cuenta</button>
  </form>

  <footer>
    ¿Ya tienes cuenta? <a href="{{ url_for('auth.entrar') }}">Entra aquí</a>
  </footer>
</article>
{% endblock %}
